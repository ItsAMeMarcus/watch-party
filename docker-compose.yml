version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: watchparty-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: 
      context: ./frontend/frontend-watchparty/
    container_name: watchparty-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
